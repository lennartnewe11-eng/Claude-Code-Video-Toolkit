<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* full-bleed archival B-roll placeholder */
  .broll { position:absolute; inset:0;
    background:
      linear-gradient(115deg, rgba(255,210,63,.10), rgba(0,0,0,.0) 40%),
      linear-gradient(0deg, rgba(0,0,0,.78), rgba(0,0,0,.15) 55%, rgba(0,0,0,.45)),
      radial-gradient(80% 70% at 35% 30%, #5a4a33, #20242c 70%);
  }
  .grain { position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay;
    background-image: radial-gradient(rgba(255,255,255,.9) .5px, transparent .6px);
    background-size: 3px 3px; }
  .scan { position:absolute; inset:0; opacity:.06;
    background: repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 4px); }
  .badge { position:absolute; top:84px; left:96px; font:700 22px Inter;
    letter-spacing:.18em; color:var(--ink-2); text-transform:uppercase;
    border:1px solid var(--line); padding:10px 18px; border-radius:8px;
    background:rgba(0,0,0,.35); }
  .badge b { color: var(--accent); }
  /* lower third */
  .lower { position:absolute; left:96px; bottom:150px; }
  .lower .yr { font:800 120px Inter; letter-spacing:-.03em; line-height:.9; color:var(--accent); }
  .lower .ttl { font:800 56px Inter; letter-spacing:-.02em; margin-top:14px; }
  .lower .sub { font:500 30px Inter; color:var(--ink-2); margin-top:10px; max-width:1100px; }
  .lower .accentbar { width:120px; height:6px; background:var(--accent); margin:22px 0 0; }
  /* route map inset */
  .inset { position:absolute; top:84px; right:96px; width:430px; height:300px;
    background:rgba(13,16,20,.72); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .inset .lbl { font:700 18px Inter; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase; }
  .inset svg { width:100%; height:230px; margin-top:6px; }
  .land { fill:#262b34; stroke:var(--line); stroke-width:2; }
  .route { fill:none; stroke:var(--accent); stroke-width:4; stroke-dasharray:7 7; }
  .city { fill:var(--accent); }
  .cityname { fill:var(--ink-2); font:600 17px Inter; }
</style></head>
<body><div class="stage">
  <div class="broll"></div><div class="grain"></div><div class="scan"></div>
  <div class="badge">Archivmaterial · <b>Library of Congress</b> · Platzhalter</div>

  <div class="inset">
    <div class="lbl">Transkontinental · 1869</div>
    <svg viewBox="0 0 400 230">
      <path class="land" d="M30,70 C70,40 120,48 180,55 C250,62 320,52 372,80
        C380,120 360,150 320,165 C250,185 160,180 95,168 C55,160 22,120 30,70 Z"/>
      <path class="route" d="M70,150 C150,120 250,110 340,95"/>
      <circle class="city" cx="70"  cy="150" r="7"/>
      <circle class="city" cx="340" cy="95"  r="7"/>
      <text class="cityname" x="46" y="178">Sacramento</text>
      <text class="cityname" x="300" y="84">Omaha</text>
    </svg>
  </div>

  <div class="lower">
    <div class="yr">1869</div>
    <div class="ttl">Die erste transkontinentale Eisenbahn</div>
    <div class="sub">Was Siedler in Planwagen Monate kostete, schrumpft auf wenige Tage — die Bahn erschließt den Westen.</div>
    <div class="accentbar"></div>
  </div>
  <div class="source" style="bottom:70px">Quellen-Beleg · Platzhalter</div>
  <div class="chapter-tag">00:53 · Das Goldene Zeitalter</div>
</div></body></html>
