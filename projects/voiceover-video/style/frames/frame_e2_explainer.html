<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="editorial.css">
<style>
  .vlabel{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);left:46px;top:90px;
    font:italic 500 28px Fraunces;color:var(--ink-2);}
  .kinblock{position:absolute;left:120px;top:300px;max-width:1060px;font-size:80px;}
  .kinblock .row{display:block;}
  .display{font-size:118px;}
  /* collage on the right */
  .collage{position:absolute;right:120px;top:150px;width:640px;height:780px;}
  .scrap{position:absolute;background:
     repeating-linear-gradient(0deg,#d7d3c4 0 1px,transparent 1px 26px),
     repeating-linear-gradient(90deg,#d7d3c4 0 1px,transparent 1px 26px),#eceadd;
     transform:rotate(-5deg);}
  .prop{position:absolute;border-radius:6px;box-shadow:0 22px 50px rgba(20,18,15,.22);}
  .prop.road{background:linear-gradient(160deg,#9b978d,#4a4843);}
  .prop.rail{background:linear-gradient(160deg,#6d7a63,#3a4435);}
  .ptag{position:absolute;font:600 18px Inter;letter-spacing:.1em;text-transform:uppercase;color:#fff;}
</style></head>
<body><div class="stage">
  <div class="vlabel">der ungleiche Wettkampf</div>
  <div class="mark-plus" style="left:120px;top:170px"></div>
  <div class="bracket br" style="right:90px;bottom:120px"></div>

  <div class="kinblock kin">
    <span class="row"><span class="sn">Den Highway baute der</span> <span class="display">Staat.</span></span>
    <span class="row" style="margin-top:14px"><span class="it">Die Bahn</span> <span class="sn">bezahlte</span> <span class="sb">alles selbst</span><span class="sn">.</span></span>
  </div>

  <div class="collage">
    <div class="scrap" style="left:60px;top:40px;width:420px;height:360px"></div>
    <div class="prop road" style="left:0;top:90px;width:520px;height:150px;transform:rotate(-3deg)">
      <span class="ptag" style="left:18px;bottom:14px">Interstate · gratis</span></div>
    <div class="prop rail" style="left:120px;top:430px;width:430px;height:300px;transform:rotate(2deg)">
      <span class="ptag" style="left:18px;bottom:14px">Schiene · privat finanziert</span></div>
    <div class="block sage" style="right:0;top:0;width:120px;height:46px"></div>
  </div>

  <div class="source">Beleg: Federal Aid Highway Act 1956 · Platzhalter</div>
  <div class="chapter-tag">03:35 · Die größte Subvention</div>
</div></body></html>
